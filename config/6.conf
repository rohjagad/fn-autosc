worker_processes auto;
worker_rlimit_nofile 100000;

events {
    worker_connections 100000;
    use epoll; # Use epoll for Linux
    multi_accept on;
}

http {
    include mime.types;
    default_type application/octet-stream;

    # The IP limit must work for a regular user, including through a CDN edge
    # Cloudflare has just started using: take the last address the chain carries
    # (Cloudflare appends the real client after anything the client sent) and fall
    # back to the peer. This is not hardened against a forged header - that is a
    # deliberate trade, recorded in is-decision.md section 24.
    # Proxy headers keep the reference form on purpose; see is-decision.md section 24.
    # NMAP SUPPORT
    map $http_x_forwarded_for $clientRealIp {
        "" $remote_addr;
        "~*(?P<firstAddr>([0-9a-f]{0,4}:){1,7}[0-9a-f]{1,4}|([0-9]{1,3}\.){3}[0-9]{1,3})$" $firstAddr;
    }

    # LOG FORMAT
    log_format main '$clientRealIp $remote_addr $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" $http_x_forwarded_for '
                    '"$upstream_addr" "$upstream_status" "$upstream_response_time" "$request_time" ';

        # Long-lived tunnels (WebSocket, HTTPUpgrade) must not be cut while idle:
    # give them the same proxy timeouts the XHTTP locations set explicitly.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_connect_timeout 60s;

# ERROR LOG FILE
    access_log /var/log/nginx/access.log main;

    # ENABLE SEND FILE
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # SET KEEP ALIVE TIMEOUT
    keepalive_timeout 65;
    keepalive_requests 100000;

    # DISABLE BUFFERING
    proxy_buffering off;

    # INCREASE BUFFER SIZE
    client_body_buffer_size 10K;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 4k;
    output_buffers 1 32k;
    postpone_output 1460;

    # TIMEOUT SETTINGS
    client_body_timeout 12;
    client_header_timeout 12;
    send_timeout 10;

    # GZIP COMPRESSION
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # UPSTREAM BACKEND PORT /
    upstream default_backend {
        server 127.0.0.1:2080 weight=1; # Forward To wsEpro Proxy
    }

    server {
        # HTTPS & SSL/SNI/TLS PORT
        listen [::]:443 ssl http2 reuseport;
        listen [::]:2053 ssl http2 reuseport;
        listen [::]:2083 ssl http2 reuseport;
        listen [::]:2087 ssl http2 reuseport;
        listen [::]:2096 ssl http2 reuseport;

        # HTTP PORT
        listen [::]:80;
        listen [::]:8880;
        listen [::]:2052;
        listen [::]:2082;
        listen [::]:2095;

        # DOMAIN SERVER  
        server_name tes1.rohshop.cloud;

        # PATH CERTIFICATE DOMAIN SERVER
        ssl_certificate /etc/xray/xray.crt;
        ssl_certificate_key /etc/xray/xray.key;

        # SERVER SUPPORTED SSL CHIPPERS
        ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+ECDSA+AES128:EECDH+aRSA+AES128:RSA+AES128:EECDH+ECDSA+AES256:EECDH+aRSA+AES256:RSA+AES256:!3DES:!MD5;
        
        # SSL VERSIONS SUPPORTED BY SERVER
        ssl_protocols TLSv1.2 TLSv1.3;

        # WEB FILE
        root /var/www/html;

location /web/ { # WEBSITE PATH https://domain.com/web/file
alias /var/www/html/; # WEBSITE FOLDER 
autoindex on; # AUTO RUN FILE INDEX ON WEBSITE
}

location /api/ { #PATH API /api/REQUEST
proxy_pass http://127.0.0.1:9000/; # Forward To Server Rest API
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Authorization $http_authorization;
}

# SSH WEBSOCKET TLS & NONTLS
location / {
if ($http_upgrade != "Upgrade") {
rewrite /(.*) / break;
}
proxy_redirect off;
proxy_pass http://default_backend; # Forward To Upstream Default
proxy_http_version 1.1;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection "upgrade";
proxy_set_header Host $http_host;
}

